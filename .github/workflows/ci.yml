name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Generate Linux screenshots for review; does not verify them
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: gameroom
    steps:
      - uses: actions/checkout@v4
        with:
          path: gameroom
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test:unit
      - run: bun run test:rules
      - run: bun run build
  screenshots:
    needs: verify
    runs-on: ubuntu-24.04-arm
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:824f1a789072e648c62541c2cfa4479c4061a290d5c27766d67dc1dcbc19b321
      options: --ipc=host
    defaults:
      run:
        working-directory: gameroom
    steps:
      - uses: actions/checkout@v4
        with:
          path: gameroom
      - uses: actions/checkout@v4
        with:
          repository: anicolao/cribbage
          ref: 6e542da6fb5d36f1f1941965bc8fa8004e422d37 # Cribbage PR 11, reviewed URL adapter
          path: cribbage
      - uses: actions/checkout@v4
        with:
          repository: anicolao/cantstop
          ref: 43b5e61ab0a86dadba1f74b22c860fb170c056cf # Replayable game and URL adapter
          path: cantstop
      - run: apt-get update && apt-get install -y --no-install-recommends unzip
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: cribbage
      - run: bun install --frozen-lockfile
        working-directory: cantstop
      - name: Verify exact pixels
        if: inputs.update_snapshots != true
        run: bun run test:e2e
        env:
          CRIBBAGE_PATH: ../cribbage
          CANTSTOP_PATH: ../cantstop
      - name: Generate references for review
        if: inputs.update_snapshots == true
        run: |
          bun run test:e2e:update
          E2E_REFERENCE_SEAT_ORDER=sam-lee E2E_GREP='three friends' bun run test:e2e:update
          E2E_REFERENCE_SEAT_ORDER=lee-sam E2E_GREP='three friends' bun run test:e2e:update
        env:
          CRIBBAGE_PATH: ../cribbage
          CANTSTOP_PATH: ../cantstop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-review
          path: |
            gameroom/tests/e2e/screenshots/*-linux.png
            gameroom/tests/e2e/*-linux.md
            gameroom/playwright-report/
            gameroom/test-results/
