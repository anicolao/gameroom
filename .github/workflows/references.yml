name: Reference generation
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to generate references for
        required: true
        default: codex/gameroom-launcher
      grep:
        description: Optional story title filter
        required: false
        default: ''
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-24.04-arm
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:824f1a789072e648c62541c2cfa4479c4061a290d5c27766d67dc1dcbc19b321
      options: --ipc=host
    defaults:
      run:
        working-directory: gameroom
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          path: gameroom
      - uses: actions/checkout@v4
        with:
          repository: anicolao/cribbage
          ref: eb3c391dcfbd0b97d5559a56c0774038bff47472 # Reviewed URL renderer + Cribbage PR 14 secure-ID compatibility patch
          path: cribbage
      - uses: actions/checkout@v4
        with:
          repository: anicolao/cantstop
          ref: 43b5e61ab0a86dadba1f74b22c860fb170c056cf # Replayable game and URL adapter
          path: cantstop
      - run: apt-get update && apt-get install -y --no-install-recommends unzip
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: cribbage
      - run: bun install --frozen-lockfile
        working-directory: cantstop
      - run: |
          E2E_REFERENCE_SEAT_ORDER=sam-lee bun run test:e2e:update
          if [ -z "$E2E_GREP" ] || bun x playwright test --list --grep "$E2E_GREP" | grep -q 'three friends automatically'; then
            E2E_REFERENCE_SEAT_ORDER=lee-sam E2E_GREP='three friends' bun run test:e2e:update
          fi
        env:
          CRIBBAGE_PATH: ../cribbage
          CANTSTOP_PATH: ../cantstop
          E2E_GREP: ${{ inputs.grep }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-reference-review
          path: |
            gameroom/tests/e2e/screenshots/*-linux.png
            gameroom/tests/e2e/*-linux.md
            gameroom/test-results/
