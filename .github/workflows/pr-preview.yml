name: Publish Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
concurrency:
  group: pages-preview
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  preview:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run check && bun run test:unit
      - name: Build with the existing LauncherUI production project
        env:
          PUBLIC_BASE_PATH: ${{ github.event_name == 'pull_request' && format('/gameroom/pr-{0}/', github.event.pull_request.number) || '/gameroom/' }}
          VITE_FIREBASE_API_KEY: ${{ secrets.PUBLIC_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.PUBLIC_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.PUBLIC_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.PUBLIC_FIREBASE_APP_ID }}
          VITE_CATALOGUE_FIREBASE_API_KEY: ${{ secrets.PUBLIC_FIREBASE_API_KEY }}
          VITE_CATALOGUE_FIREBASE_AUTH_DOMAIN: ${{ secrets.PUBLIC_FIREBASE_AUTH_DOMAIN }}
          VITE_CATALOGUE_FIREBASE_PROJECT_ID: ${{ secrets.PUBLIC_FIREBASE_PROJECT_ID }}
          VITE_CATALOGUE_FIREBASE_APP_ID: ${{ secrets.PUBLIC_FIREBASE_APP_ID }}
          VITE_USE_FIREBASE_EMULATORS: 'false'
          VITE_CATALOGUE_USE_FIREBASE_EMULATORS: 'false'
          VITE_CATALOGUE_ASSET_ORIGIN: https://anicolao.github.io/ttlauncher/
        run: |
          for variable in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID; do
            test -n "${!variable}" || { echo "Missing production client configuration: $variable"; exit 1; }
          done
          bun run build
          cp LICENSE dist/LICENSE
      - name: Record the published source
        run: |
          SOURCE_COMMIT=$(git rev-parse HEAD)
          export SOURCE_COMMIT
          node -e 'require("node:fs").writeFileSync("dist/deployment.json", JSON.stringify({commit:process.env.SOURCE_COMMIT,run:"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"})+"\n")'
      - name: Assemble the site and retain PR previews
        env:
          PR_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }}
        run: |
          git fetch origin gh-pages
          git worktree add site origin/gh-pages
          if [ -n "$PR_NUMBER" ]; then
            [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
            rm -rf "site/pr-${PR_NUMBER}"
            mkdir -p "site/pr-${PR_NUMBER}"
            cp -R dist/. "site/pr-${PR_NUMBER}/"
          else
            # Root files come from main; keep every existing PR preview directory.
            find site -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.nojekyll' ! -name 'pr-*' -exec rm -rf -- {} +
            cp -R dist/. site/
          fi
          cd site
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish ${PR_NUMBER:+PR }${PR_NUMBER:-main}"
            git push origin HEAD:gh-pages
          fi
          rm .git
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deploy
