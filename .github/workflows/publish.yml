name: Publish Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      preview_run_id:
        description: Optional successful PR preview build run to publish
        required: false
        default: ''
  workflow_run:
    workflows: [PR preview]
    types: [completed]
concurrency:
  group: pages-publication
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    env:
      PREVIEW_RUN_ID: ${{ github.event.workflow_run.id || inputs.preview_run_id || '' }}
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
      - name: Validate and download the preview build
        if: env.PREVIEW_RUN_ID != ''
        id: preview
        uses: actions/github-script@v7
        with:
          script: |
            await require('./scripts/select-preview.cjs')({github, context, core});
      - name: Extract validated preview files
        if: steps.preview.outputs.publish == 'true'
        run: python3 scripts/extract-preview.py "$RUNNER_TEMP/preview.zip" preview-build
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
        if: env.PREVIEW_RUN_ID == ''
      - run: bun run check && bun run test:unit
        if: env.PREVIEW_RUN_ID == ''
      - name: Build with the existing LauncherUI production project
        if: env.PREVIEW_RUN_ID == ''
        env:
          PUBLIC_BASE_PATH: /
          VITE_FIREBASE_API_KEY: ${{ secrets.PUBLIC_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.PUBLIC_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.PUBLIC_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.PUBLIC_FIREBASE_APP_ID }}
          VITE_CATALOGUE_FIREBASE_API_KEY: ${{ secrets.PUBLIC_FIREBASE_API_KEY }}
          VITE_CATALOGUE_FIREBASE_AUTH_DOMAIN: ${{ secrets.PUBLIC_FIREBASE_AUTH_DOMAIN }}
          VITE_CATALOGUE_FIREBASE_PROJECT_ID: ${{ secrets.PUBLIC_FIREBASE_PROJECT_ID }}
          VITE_CATALOGUE_FIREBASE_APP_ID: ${{ secrets.PUBLIC_FIREBASE_APP_ID }}
          VITE_USE_FIREBASE_EMULATORS: 'false'
          VITE_CATALOGUE_USE_FIREBASE_EMULATORS: 'false'
          VITE_CATALOGUE_ASSET_ORIGIN: https://anicolao.github.io/ttlauncher/
        run: |
          for variable in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID; do
            test -n "${!variable}" || { echo "Missing production client configuration: $variable"; exit 1; }
          done
          bun run build
          cp LICENSE dist/LICENSE
      - name: Record the published source
        if: env.PREVIEW_RUN_ID == ''
        run: |
          SOURCE_COMMIT=$(git rev-parse HEAD)
          export SOURCE_COMMIT
          node -e 'require("node:fs").writeFileSync("dist/deployment.json", JSON.stringify({commit:process.env.SOURCE_COMMIT,run:"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"})+"\n")'
      - name: Check out publication
        if: env.PREVIEW_RUN_ID == '' || steps.preview.outputs.publish == 'true'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - name: Assemble production or the numbered preview
        if: env.PREVIEW_RUN_ID == '' || steps.preview.outputs.publish == 'true'
        env:
          PR_NUMBER: ${{ steps.preview.outputs.pr_number }}
          PREVIEW_COMMIT: ${{ steps.preview.outputs.commit }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            bun scripts/assemble-pages.ts site preview-build "$PR_NUMBER"
          else
            bun scripts/assemble-pages.ts site dist
          fi
          cd site
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish ${PR_NUMBER:+PR }${PR_NUMBER:-main}"
            git push origin HEAD:gh-pages
          fi
          python3 -c 'import shutil; shutil.rmtree(".git")'
      - uses: actions/configure-pages@v5
        if: env.PREVIEW_RUN_ID == '' || steps.preview.outputs.publish == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: env.PREVIEW_RUN_ID == '' || steps.preview.outputs.publish == 'true'
        with:
          path: site
      - uses: actions/deploy-pages@v4
        if: env.PREVIEW_RUN_ID == '' || steps.preview.outputs.publish == 'true'
        id: deploy
